name: Discord Notifier

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Discord notifier
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.DISCORD_NOTIFIER_SECRET }}" \
            "https://bvp-betting.vercel.app/api/notifications/discord"
